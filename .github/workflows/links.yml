name: Check links

# Builds the site and follows every link in every page, local and external,
# including the download URLs that come from GitHub releases. Also checks
# that the live site answers. A broken link opens an issue, or adds to the
# one already open.
on:
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      - name: Fetch lychee
        # The binary straight from its release, checked against the sum
        # recorded here, as the repository allows no third-party actions
        env:
          VERSION: lychee-v0.24.2
          SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -sSL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/$VERSION/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "$SHA256  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Follow every link
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=0
          lychee --no-progress \
            --root-dir "$GITHUB_WORKSPACE/dist" \
            --base-url https://helixtech.app \
            --max-concurrency 4 \
            --max-retries 2 \
            --accept '200..=299,429' \
            --exclude '^https://api\.web3forms\.com/' \
            --exclude '^https://helixtech\.app/404/$' \
            --format markdown \
            --output lychee.md \
            'dist/**/*.html' \
            https://helixtech.app/ \
            https://helixtech.app/sitemap-index.xml \
            https://helixtech.app/feed.xml || code=$?
          cat lychee.md
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Report what broke
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The link check on $(date -u +%Y-%m-%d) found links that do not answer. Run: $RUN_URL"
            echo
            cat lychee.md
          } > body.md
          gh label create 'broken links' --color d73a4a --description 'A link on the site stopped working' --force
          open=$(gh issue list --label 'broken links' --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title 'Broken links on the site' --label 'broken links' --body-file body.md
          fi
          exit 1
