name: Quality

# Runs Lighthouse on the built site. A drop in accessibility, best practices
# or SEO below 95 fails the run; performance only warns, as it varies with
# the runner. The reports are kept as an artifact. Thresholds live in
# lighthouserc.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      # Not a dependency of the site: it would add its own tree to the audit.
      # Fetched fresh, with a retry for the registry's occasional miss.
      - run: for try in 1 2 3; do npx --yes @lhci/cli@0.15.1 autorun && exit 0; sleep 30; done; exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: lighthouse
          retention-days: 14
